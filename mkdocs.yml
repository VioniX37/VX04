site_name: Grounded AutoML-Agent
site_description: Multi-agent LLM framework for full-pipeline AutoML with grounded verification and experience memory
repo_url: https://github.com/VioniX37/VX04
repo_name: VioniX37/VX04
edit_uri: edit/main/docs/
docs_dir: docs
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [backend/src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_symbol_type_heading: true
            members_order: source
            separate_signature: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Colab and Kaggle: getting-started/colab-kaggle.md
  - User guide:
      - Writing requests: user-guide/writing-requests.md
      - Datasets: user-guide/datasets.md
      - Reading results: user-guide/reading-results.md
  - Concepts:
      - Architecture: concepts/architecture.md
      - Agents: concepts/agents.md
      - Pipeline stages: concepts/pipeline-stages.md
      - Grounded verification: concepts/grounded-verification.md
      - Experience memory: concepts/experience-memory.md
      - Large data: concepts/large-data.md
      - LLM layer: concepts/llm-layer.md
  - Reference:
      - Configuration: reference/configuration.md
      - REST API: reference/rest-api.md
      - Event schema: reference/event-schema.md
      - CLI: reference/cli.md
      - Python API: reference/python-api.md
  - Research:
      - Original paper: research/paper-summary.md
      - Comparison with the paper: research/comparison.md
      - Research proposal: research/proposal.md
      - Evaluation protocol: research/evaluation-protocol.md
      - Results: research/results.md
  - Development:
      - Contributing: development/contributing.md
      - Testing: development/testing.md
      - Decision records:
          - development/adr/index.md
          - "ADR 0001: Gemini-only LLM layer": development/adr/0001-gemini-only.md
          - "ADR 0002: Parquet ingest and fixed splits": development/adr/0002-parquet-ingest.md
          - "ADR 0003: Grounded verification": development/adr/0003-grounded-verification.md
          - "ADR 0004: Template-grounded code generation": development/adr/0004-template-grounded-codegen.md
          - "ADR 0005: Experience memory": development/adr/0005-experience-memory.md
      - Changelog: development/changelog.md
