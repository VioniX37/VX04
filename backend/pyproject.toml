[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automl-agent"
version = "0.1.0"
description = "Multi-agent LLM framework for full-pipeline AutoML (re-implementation of arXiv:2410.02958 + extensions)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "sse-starlette>=2.1",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlmodel>=0.0.21",
  "httpx>=0.27",
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  # Large-data pipeline
  "polars>=1.20",
  "pyarrow>=16",
  "lightgbm>=4.3",
  "xgboost>=2.1",
  "psutil>=5.9",
  # LLM: Gemini via the official Google GenAI SDK
  "google-genai>=1.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
eval = ["optuna>=3.6", "matplotlib>=3.8", "scipy>=1.11"]

[project.scripts]
automl-agent = "automl_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
automl_agent = ["prompts/*.md", "knowledge/*.json", "execution/templates/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["src/automl_agent/execution/templates", "evaluation/baselines/optuna_lgbm_script.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["automl_agent", "evaluation"]
